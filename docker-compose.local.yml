version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agentlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-context_lab}
    ports:
      - "3306:3306"
    volumes:
      - agentlab_mysql_data:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentlab-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-context_lab}
      ROOT_DIR: /workspace
    volumes:
      - agentlab_workspace:/workspace
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentlab-frontend
    restart: unless-stopped
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: agentlab-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - appnet

volumes:
  agentlab_workspace:
  agentlab_mysql_data:

networks:
  appnet:
    driver: bridge
