server {
    listen 80;
    server_name localhost;

    # gzip 压缩(JS/CSS/JSON 等大文件,1.3MB bundle → ~434KB,省 67%)
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # 静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # LLM API 反代（保持现状）
    location /api/anthropic/ {
        proxy_pass https://api.deepseek.com/anthropic/;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-api-key $http_x_api_key;
        proxy_ssl_server_name on;
    }

    # 后端 DB API 反代（新增）
    location /api/db/ {
        proxy_pass http://127.0.0.1:8000/api/db/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Settings API 反代
    location /api/settings {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Agent API 反代（RQ-2+，智能体载体）—— 无尾斜杠 + proxy_pass 无 URI,透传完整路径
    location /api/agents {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
