# dsh(DeepSeek Harness) ECS 宿主机 nginx 反代配置备份
# 真实文件在 ECS: /etc/nginx/conf.d/dsh.conf(token 为真实值,本文件占位)
# 部署日期: 2026-08-19(当天三次迭代: 静态资源放行 → token 纯值修正 → randomUUID polyfill)
#
# 用途: 外露 http://47.97.66.45:3080 → 宿主机 127.0.0.1:3081(dsh web, systemd dsh-web.service)
# - API + WebSocket + 主页: token query 校验(不用 basic auth: Chrome 阻止跨源 iframe 的 WWW-Authenticate 弹窗)
# - 静态资源(/assets/*.js|css /favicon.svg /manifest.webmanifest): 放行
#   ⚠️ 教训: 浏览器加载子资源不带 query token,首版全路径 token 门导致 JS/CSS 全 403 → 页面空壳/502。
#   静态包无敏感数据,API 门(保护 GLM key)才是关键;dsh wire 协议原生 POST /api/{m}?token= 自带 token。
# - 主页注入 crypto.randomUUID polyfill(sub_filter):
#   纯 HTTP 公网 IP = 非安全上下文,浏览器无 crypto.randomUUID(dsh 选工作区时生成 id 崩);
#   crypto.getRandomValues 非安全上下文可用,用它兜底。需 proxy_set_header Accept-Encoding ""。
# - WebSocket 透传(dsh 下行 /api/events.mux + /api/events.host 需要 Upgrade 头)
#
# 注意: 宿主机 /etc/nginx/nginx.conf 默认配置监听 80 会与 docker-proxy(容器端口映射 80)冲突,
# 已替换为仅 include conf.d 的干净版本(备份于 nginx.conf.bak)。
# token 真实值在 ECS /root/.dsh/nginx_token(600 权限,纯值无前缀)。

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 3080;
    server_name _;
    location /api/ {
        if ($arg_token != "<TOKEN>") { return 403; }
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host:$server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = / {
        if ($arg_token != "<TOKEN>") { return 403; }
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter </head> '<script>if(!crypto.randomUUID){crypto.randomUUID=function(){var b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h="";for(var i=0;i<16;i++){h+=b[i].toString(16).padStart(2,"0")}return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script></head>';
    }
    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }
}
