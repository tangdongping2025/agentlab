# dsh(DeepSeek Harness) ECS 宿主机 nginx 反代配置备份
# ⚠️ 2026-08-20 起 dsh 改为**用户本机部署**(C:\Users\Administrator\.dsh\start_dsh.cmd →
#    dsh web 127.0.0.1:3081,iframe 指 http://localhost:3081)。本配置保留备用——若将来要公网
#    访问 dsh,恢复 ECS systemd dsh-web.service + 本文件即可(cookie 门是四轮踩坑后的最终形态)。
#
# 四轮踩坑史(别再踩):
# 1. 全路径 token query 门 → 浏览器子资源(/assets/*.js)不带主页的 ?token= → JS/CSS 全 403 空壳。
#    修:静态资源放行,只有主页与 /api/ 保留门。
# 2. token 文件内容带 "TOKEN=" 前缀被整串读进 nginx 期望值,自测同源 cat 同一文件 → 假绿。
#    修:/root/.dsh/nginx_token 规范为纯值;验证输入必须取自用户真实 URL,不能与被测配置同源。
# 3. 纯 HTTP 公网 IP = 非安全上下文,crypto.randomUUID 不存在,dsh 选工作区即崩。
#    修:主页 sub_filter 注入 polyfill(getRandomValues 兜底),需 Accept-Encoding ""。
# 4. dsh 前端调 API(/api/host.describe 等 RPC + /api/events.mux WS)**不在 URL 上带 token**,
#    WS 握手也无 Referer → query/Referer 门全挡死("transport failure ... HTTP 403")。
#    修:主页过门时 Set-Cookie 种 gate cookie,API/WS 改验 cookie(浏览器同源自动带,WS 也带;
#    iframe 跨端口但同 host = same-site,SameSite=Lax 不受影响)。
#
# 用途: 外露 http://47.97.66.45:3080 → 宿主机 127.0.0.1:3081(dsh web, systemd dsh-web.service)
# token 真实值在 ECS /root/.dsh/nginx_token,gate cookie secret 在 /root/.dsh/nginx_gate(均 600,纯值)
# 注意: 宿主机 /etc/nginx/nginx.conf 已替换为仅 include conf.d 的干净版(默认 80 与 docker-proxy 冲突,备份 nginx.conf.bak)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# gate cookie 校验(占位 <GATE>,真实值见上)
map $http_cookie $gate_ok { default 0; "~*dsh_gate=<GATE>" 1; }
server {
    listen 3080;
    server_name _;
    location /api/ {
        if ($gate_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host:$server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = / {
        if ($arg_token != "<TOKEN>") { return 403; }
        add_header Set-Cookie "dsh_gate=<GATE>; Path=/; Max-Age=2592000; SameSite=Lax";
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter </head> '<script>if(!crypto.randomUUID){crypto.randomUUID=function(){var b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h="";for(var i=0;i<16;i++){h+=b[i].toString(16).padStart(2,"0")}return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script></head>';
    }
    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }
}
