# dsh(DeepSeek Harness) ECS 宿主机 nginx 反代配置备份
# 真实文件在 ECS: /etc/nginx/conf.d/dsh.conf(token 为真实值,本文件占位)
# 部署日期: 2026-08-19
#
# 用途: 外露 http://47.97.66.45:3080 → 宿主机 127.0.0.1:3081(dsh web, systemd dsh-web.service)
# - token query param 校验(不用 basic auth: Chrome 阻止跨源 iframe 的 WWW-Authenticate 弹窗)
# - WebSocket 透传(dsh 下行 /api/events.mux + /api/events.host 需要 Upgrade 头)
#
# 注意: 宿主机 /etc/nginx/nginx.conf 默认配置监听 80 会与 docker-proxy(容器端口映射 80)冲突,
# 已替换为仅 include conf.d 的干净版本(见本目录 dsh-nginx.conf 同名说明,备份于 nginx.conf.bak)。
# token 真实值在 ECS /root/.dsh/nginx_token(600 权限)。

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 3080;
    server_name _;
    location / {
        if ($arg_token != "<TOKEN>") { return 403; }
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host:$server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
